[Mouse]
; 現代 RTS 滑鼠控制模式 (Modern RTS Controls)
; 1 = 開啟 (右鍵移動，左鍵選取 / 框選) [Enable: Right-Click Move, Left-Click Select Only]
; 0 = 關閉 (原版操控) [Disable: Original Controls]
EnableRightClickMove=1

; 現代按鍵模式：左鍵選取，禁止左鍵移動 (Modern Controls: Left-Click Select, Right-Click Move)
; 1 = 開啟現代模式 (左鍵只能選取/施法/UI，右鍵才能移動)
; 0 = 原版模式 (左鍵與右鍵皆可移動)
ModernControls=1

; 按住 Shift + 右鍵 保留原版右鍵功能 (旋轉視角 / 取消法術)
; 1 = 是, 0 = 否
ShiftRevertsToRightClick=1

; 滑鼠中鍵 (滾輪按下) 旋轉視角 (Middle Click Rotates Camera)
; 1 = 開啟, 0 = 關閉
MiddleClickRotatesCamera=1

; 是否開啟除錯日誌 (0 = 關閉, 1 = 開啟 populous_mouse.log)
DebugLog=1
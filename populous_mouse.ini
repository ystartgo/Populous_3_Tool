[Mouse]
; 現代 RTS 滑鼠操作模式：右鍵點擊地面移動 / 攻擊
; 1 = 開啟, 0 = 關閉
EnableRightClickMove=1

; 釋放左鍵移動：左鍵僅保留選取/框選與介面點擊，點擊地面不發出移動命令
; 1 = 開啟現代模式 (左鍵選取/框選，右鍵移動)
; 0 = 原版模式 (左鍵與右鍵皆可移動)
ModernControls=1

; 按住 Shift + 右鍵 是否保留原版右鍵功能 (取消施法 / 取消目標)
; 1 = 是, 0 = 否
ShiftRevertsToRightClick=1

; 是否開啟除錯日誌 (0 = 關閉, 1 = 開啟 populous_mouse.log)
DebugLog=0
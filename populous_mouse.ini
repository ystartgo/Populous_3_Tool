[Mouse]
; 現代 RTS 滑鼠控制模式 (Modern RTS Controls)
; 1 = 啟用 (右鍵移動，左鍵選取 / 框選) [Enable: Right-Click Move, Left-Click Select Only]
; 0 = 停用 (原版按鍵) [Disable: Original Controls]
EnableRightClickMove=1

; 現代按鍵模式：左鍵選取，點空地取消選取，右鍵移動 (Modern Controls: Left-Click Select/Deselect, Right-Click Move)
; 1 = 啟用現代模式
; 0 = 原版模式
ModernControls=1

; 按住 Shift + 右鍵 維持原版右鍵功能 (旋轉視角 / 地形魔法)
; 1 = 是, 0 = 否
ShiftRevertsToRightClick=1

; 滑鼠中鍵 (滾輪按下) 旋轉視角 (Middle Click Rotates Camera)
; 1 = 啟用, 0 = 停用
MiddleClickRotatesCamera=1

; 是否啟用除錯日誌 (0 = 停用, 1 = 啟用 populous_mouse.log)
DebugLog=1
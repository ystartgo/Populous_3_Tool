[Mouse]
; 現代 RTS 滑鼠操作模式：右鍵點擊地面移動 / 攻擊
; 1 = 開啟, 0 = 關閉
EnableRightClickMove=1

; 徹底釋放左鍵移動：左鍵單擊地面改為「取消選取 / 釋放小人」，拖曳保持「框選」
; 1 = 開啟 (左鍵單擊=取消選取，左鍵拖曳=框選，右鍵=移動小人)
; 0 = 雙鍵移動 (左鍵與右鍵皆可移動)
LeftClickDeselects=1

; 按住 Shift + 右鍵 是否保留原版右鍵功能 (取消選取、查詢、取消建築)
; 1 = 是, 0 = 否
ShiftRevertsToRightClick=1

; 拖曳框選門檻 (像素距離，預設 6)
DragThreshold=6

; 是否開啟除錯日誌 (0 = 關閉, 1 = 開啟 populous_mouse.log)
DebugLog=0